# Mihomo Configuration | Leo Bennett | V4.13
# Update: 2026-02-03 (Chapter 2 Integrated)

# 1. 基础设置
mixed-port: 7890
redir-port: 9797
tproxy-port: 9898
mode: Rule
bind-address: '*'
ipv6: true
allow-lan: true
unified-delay: false
log-level: error
find-process-mode: always
tcp-concurrent: true # 开启 TCP 并发

external-controller: 0.0.0.0:9090
external-ui: ./dashboard
secret: ""

geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
  asn: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"

experimental:
  http-headers:
    request:
      - name: "User-Agent"
        value: "Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/135.0.0.0 Mobile Safari/537.36"
      - name: "Accept-Language"
        value: "en-US,en;q=0.9"

disable-keep-alive: true
geodata-mode: false
geo-auto-update: false
geo-update-interval: 24
updatetime: &Time 86400

# 锚点
p: &p
  type: http
  interval: *Time
  health-check:
    enable: true
    url: https://www.apple.com/library/test/success.html
    interval: 300
  proxy: 订阅更新
  header:
      User-Agent: ["ClashMetaForAndroid/2.11.2.Meta", "clash-verge/v2.2.3", "ClashforWindows/0.19.23", "clash.meta", "mihomo"]

# 2. 代理提供者
proxy-providers:
  proxy1:
    <<: *p
    override:
      additional-prefix: "Main："
      client-fingerprint: chrome
    path: ./proxy_provider/proxy1.yaml
    url: "此处引入您的Clash订阅链接地址"

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP: {ports: [80, "8080-8880"], override-destination: true}
    TLS: {ports: [443, 8443]}
    QUIC: {ports: [443, 8443]}
  force-domain: ["+.v2ex.com"]
  skip-domain: ["Mijia Cloud", "+.push.apple.com"]

tun:
  enable: true
  device: Meta
  stack: mixed
  dns-hijack: [any:53, tcp://any:53]
  udp-timeout: 300
  auto-route: true
  strict-route: true
  auto-redirect: false
  auto-detect-interface: true

# 3. DNS 设置
dns:
  enable: true
  listen: ":1053"
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  fake-ip-filter: ["RULE-SET:Fake-IP-Filter", "RULE-SET:CN", "RULE-SET:Private", "RULE-SET:GoogleFCM", "+.lan", "+.local", "+.msftconnecttest.com", "+.msftncsi.com"]
  default-nameserver: [223.5.5.5, 119.29.29.29, 2400:3200::1]
  proxy-server-nameserver: [tls://dns.alidns.com, tls://dot.pub]
  nameserver: [tls://dns.google, tls://1.1.1.1]
  nameserver-policy:
    'services.googleapis.cn': '1.1.1.1' # 小米系统修复
    "RULE-SET:CN,Private,Apple,GoogleCN,GamesCN": [tls://dns.alidns.com, tls://dot.pub]
    "RULE-SET:Geolocation_NotCN": [tls://dns.google, tls://1.1.1.1]

# 4. 策略组
use_all_provider: &use_all_provider
  use: [proxy1]

proxy-groups:
  # 🟢 第一梯队：控制中心
  - name: 节点选择
    type: select
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png"
    proxies: [自动选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点, 手动切换, 低倍率节点, 其他地区, DIRECT, REJECT]

  - name: 自动选择
    type: url-test
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png"
    tolerance: 50
    interval: 300
    filter: "(?i)(香港|台湾|日本|新加坡|美国|韩国|🇭🇰|🇹🇼|🇯🇵|🇸🇬|🇺🇸|🇰🇷)(?!.*(?i)(官网|官網|套餐|流量|测试|test|订阅|更新|维护|暂停|通知|超时|到期|剩余|重置|(([2-9]|\\d{2,})(\\.\\d+)?|1\\.[1-9])\\s*(x|×|倍)|(0\\.\\d+|0)(\\s)*(x|×|倍)|高倍|free|low|公益|低倍))"
