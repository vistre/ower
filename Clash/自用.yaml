# 6. 分流规则
rules:
  # 1. 协议优化 (QUIC 阻断)
  - AND,((NETWORK,udp),(DST-PORT,443)),REJECT

  # 2. 工业级局域网与回环修正 (L1 - 确保 NAS、打印机 100% 直连)
  - IP-CIDR,0.0.0.0/8,全球直连,no-resolve
  - IP-CIDR,10.0.0.0/8,全球直连,no-resolve
  - IP-CIDR,100.64.0.0/10,全球直连,no-resolve      # 运营商级 NAT (CGNAT)
  - IP-CIDR,127.0.0.0/8,全球直连,no-resolve
  - IP-CIDR,169.254.0.0/16,全球直连,no-resolve     # 链路本地地址 (APIPA)
  - IP-CIDR,172.16.0.0/12,全球直连,no-resolve
  - IP-CIDR,192.168.0.0/16,全球直连,no-resolve
  - IP-CIDR,198.18.0.0/15,全球直连,no-resolve      # Fake-IP 保留区
  - IP-CIDR,224.0.0.0/4,全球直连,no-resolve        # 组播流量
  - IP-CIDR6,::1/128,全球直连,no-resolve          # IPv6 回环
  - IP-CIDR6,fc00::/7,全球直连,no-resolve         # IPv6 唯一本地地址
  - IP-CIDR6,fe80::/10,全球直连,no-resolve        # IPv6 链路本地地址
  - DOMAIN-SUFFIX,local,全球直连
  - DOMAIN-SUFFIX,lan,全球直连
  # 双重保险
  - RULE-SET,Private,全球直连

  # 3. Steam 下载满速优化 (最高权重直连)
  - DOMAIN-SUFFIX,steamcontent.com,全球直连
  - DOMAIN,steamcdn-a.akamaihd.net,全球直连
  - DOMAIN-SUFFIX,cm.steampowered.com,全球直连
  - DOMAIN-SUFFIX,steamserver.net,全球直连
  - DOMAIN-SUFFIX,steamchina.com,全球直连

  # 3.1 核心修复
  - DOMAIN-SUFFIX,googleapis.cn,Google/Gemini
  - DOMAIN-SUFFIX,googlevideo.com,Google/Gemini
  - DST-PORT,123,全球直连

  # 3.2 自定义保留
  - DOMAIN-KEYWORD,pilipili,全球直连
  - DOMAIN-KEYWORD,embyplus,Emby
  - DOMAIN-SUFFIX,cdn.bgp.yt,全球直连
  - DOMAIN-SUFFIX,media.nijigem.by,全球直连
  - DOMAIN-SUFFIX,steamtools.net,全球直连
  - DOMAIN-KEYWORD,steamtools,全球直连
  - DOMAIN-SUFFIX,challenges.clouflare.com,节点选择
  - DOMAIN,v1.uhdnow.com,全球直连
  - DOMAIN-SUFFIX,rainbowsky.xyz,全球直连

  # 4. 广告拦截 & 安全 (L2)
  - DST-PORT,3478,REJECT # 拦截 WebRTC STUN
  - RULE-SET,NoAds,广告拦截
  - RULE-SET,Hijacking,应用净化
  - DOMAIN-KEYWORD,adobe,REJECT

  # 5. 媒体分流 (L3 - Specific > Global)
  - RULE-SET,YouTube,油管视频
  - RULE-SET,Netflix,奈飞视频
  - RULE-SET,Netflix_IP,奈飞视频,no-resolve
  - RULE-SET,Bahamut,巴哈姆特
  - RULE-SET,NetEaseMusic,网易音乐
  - RULE-SET,BiliBili,哔哩哔哩
  # GlobalMedia 作为国外媒体兜底
  - RULE-SET,GlobalMedia,国外媒体

  # 6. AI 服务
  - RULE-SET,OpenAI,OpenAI

  # 7. 社交、开发与基础服务 (L4)
  - RULE-SET,Telegram,电报消息
  - RULE-SET,Telegram_IP,电报消息,no-resolve
  - RULE-SET,Microsoft,微软服务
  - RULE-SET,Apple,苹果服务
  - RULE-SET,Apple_IP,苹果服务,no-resolve
  - RULE-SET,Google,Google/Gemini
  - RULE-SET,Google_IP,Google/Gemini,no-resolve
  - RULE-SET,GoogleFCM,谷歌FCM
  - RULE-SET,GitHub,节点选择

  # 8. 游戏平台
  - RULE-SET,Steam,游戏平台
  - RULE-SET,Epic,游戏平台
  - RULE-SET,Origin,游戏平台
  - RULE-SET,Sony,游戏平台
  - RULE-SET,Nintendo,游戏平台

  # 9. 最终兜底逻辑 (去重与性能优化版)
  - RULE-SET,ProxyGFWlist,节点选择
  - RULE-SET,CN,全球直连
  - RULE-SET,CN_IP,全球直连,no-resolve
  - RULE-SET,ChinaMax,全球直连
  - GEOIP,CN,全球直连,no-resolve
  - MATCH,漏网之鱼
