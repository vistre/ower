# 5. 规则提供者
rule-providers:
  # —— Core & Safety ——
  Fake-IP-Filter:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    path: ./rules/fakeip-filter.mrs
    url: "https://fastly.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/fakeip-filter.mrs"

  Private:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    path: ./rules/Private.mrs
    url: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/private.mrs"

  Hijacking:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    path: ./rules/Hijacking.yaml
    url: "https://fastly.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Hijacking/Hijacking.yaml"

  NoAds:
    type: http
    behavior: domain
    format: yaml
    interval: 86400
    path: ./rules/AWAvenue-Ads.yaml
    url: "https://fastly.jsdelivr.net/gh/TG-Twilight/AWAvenue-Ads-Rule@main/Filters/AWAvenue-Ads-Rule-Clash.yaml"

  # —— Domestic & Fallback ——
  ChinaMax:
    type: http
    behavior: classical
    format: text
    interval: 86400
    path: ./ruleset/ChinaMax.list
    url: "https://fastly.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/ChinaMax/ChinaMax.list"

  CN:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    path: ./rules/CN.mrs
    url: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/cn.mrs"

  CN_IP:
    type: http
    behavior: ipcidr
    format: mrs
