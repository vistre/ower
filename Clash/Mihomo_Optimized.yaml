# —————————
# Mihomo Optimized Configuration
# Version: V4.5
# Update: 2026-02-02
# —————————
# 基础设置
mixed-port: 7890
redir-port: 9797
tproxy-port: 9898
mode: Rule
bind-address: '*'
ipv6: true
allow-lan: true
unified-delay: false
tcp-concurrent: true
log-level: error
find-process-mode: always

external-controller: 0.0.0.0:9090
external-ui: ./dashboard
secret: ""

geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
  asn: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"

experimental:
  http-headers:
    request:
      - name: "User-Agent"
        value: "Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/135.0.0.0 Mobile Safari/537.36"
      - name: "Accept-Language"
        value: "en-US,en;q=0.9"

# —————————
# 其他优化配置
disable-keep-alive: true
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
updatetime: &Time 86400

# —————————
# 锚点
p: &p
  type: http
  interval: *Time
  health-check:
    enable: true
    url: https://www.gstatic.com/generate_204
    interval: 300
  proxy: 订阅更新
  header:
      User-Agent:
        - "ClashMetaForAndroid/2.11.2.Meta"
        - "clash-verge/v2.2.3"
        - "ClashforWindows/0.19.23"
        - "clash.meta"
        - "mihomo"

# 订阅地址
proxy-providers:
  proxy1:
    <<: *p
    override:
      additional-prefix: "Main："
    path: ./proxy_provider/proxy1.yaml
    url: "此处引入您的Clash订阅链接地址"
#  proxy2:
#    <<: *p
#    override:
#      additional-prefix: "Minor："
#    path: ./proxy_provider/proxy2.yaml
#    url: "此处引入您的Clash订阅链接地址"
#  proxy3:
#    <<: *p
#    override:
#      additional-prefix: "Additi："
#    path: ./proxy_provider/proxy3.yaml
#    url: "此处引入您的Clash订阅链接地址"

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, "8080-8880"]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

tun:
  enable: true
  device: Meta
  stack: gvisor
  dns-hijack:
    - any:53
    - tcp://any:53
  udp-timeout: 300
  auto-route: true
  strict-route: true
  auto-redirect: false
  auto-detect-interface: true

# —————————
# DNS 模块
dns:
  enable: true
  listen: ":1053"
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  fake-ip-filter:
    - "RULE-SET:Fake-IP-Filter" # 引用外部规则集 (优化)
    - "RULE-SET:CN"
    - "RULE-SET:Private"
    - "RULE-SET:GoogleFCM"
    - "+.lan"
    - "+.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 2400:3200::1
  proxy-server-nameserver:
    - tls://dns.alidns.com
    - tls://dot.pub
  nameserver:
    - tls://dns.google
    - tls://1.1.1.1
  nameserver-policy:
    "RULE-SET:CN,Private,Apple,GoogleCN,GamesCN":
      - tls://dns.alidns.com
      - tls://dot.pub
    "RULE-SET:Geolocation_NotCN":
      - tls://dns.google
      - tls://1.1.1.1

# —————————
# 策略组
use_all_provider: &use_all_provider
  use:
    - proxy1
    # - proxy2
    # - proxy3

proxy-groups:
  # 🟢 第一梯队：控制中心
  - name: 节点选择
    type: select
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png"
    proxies:
      - 自动选择
      - 香港节点
      - 台湾节点
      - 日本节点
      - 新加坡节点
      - 美国节点
      - 手动切换
      - 低倍率节点
      - 其他地区
      - DIRECT
      - REJECT

  - name: 自动选择
    type: url-test
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png"
