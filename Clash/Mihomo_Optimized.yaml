# Mihomo Configuration | Leo Bennett | Optimized
# Update: 2026-02-03
# Core: Meta | Mode: Rule

# ——————————————————————————————
# 1. 基础设置 (General)
# ——————————————————————————————
mixed-port: 7890
redir-port: 9797
tproxy-port: 9898
mode: Rule
bind-address: '*'
ipv6: false
allow-lan: true
unified-delay: false
log-level: error
find-process-mode: always

external-controller: 0.0.0.0:9090
external-ui: ./dashboard
secret: ""

profile:
  store-selected: true
  store-fake-ip: true

experimental:
  http-headers:
    request:
      - name: "User-Agent"
        value: "Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/135.0.0.0 Mobile Safari/537.36"

# ——————————————————————————————
# 2. 系统接口 & 流量识别 (Interface & Sniffer)
# ——————————————————————————————
# TUN 模式：虚拟网卡，接管系统流量的核心
tun:
  enable: true
  stack: mixed # mixed / gvisor / system
  device: meta
  mtu: 9000
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  strict-route: true
  auto-redirect: true
  auto-detect-interface: true
  include-android-user: [0, 10]

# 流量嗅探：准确识别 HTTPS/QUIC 流量的域名
sniffer:
  enable: true
  parse-pure-ip: true
  sniff:
    TLS: {ports: [443, 8443]}
    HTTP: {ports: [80, 8080-8880], override-destination: true}
    QUIC: {ports: [443, 8443]}

# ——————————————————————————————
# 3. DNS 设置 (Name Resolution)
# ——————————————————————————————
dns:
  enable: true
  listen: "127.0.0.1:5335"
  use-system-hosts: false
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  
  # 默认 DNS (解析国外)
  default-nameserver: 
    - 223.5.5.5
    - 119.29.29.29
    - 8.8.8.8
  
  # 主 DNS 池
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
  
  # 分流策略：国内强制走国内 DNS
  nameserver-policy:
    "geosite:cn,private": [223.5.5.5, 119.29.29.29]
  
  fallback:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    - https://doh.dns.sb/dns-query
    - tls://8.8.4.4
  
  fallback-filter:
    geoip: true
    ipcidr: [240.0.0.0/4, 0.0.0.0/32, 127.0.0.1/32]
    domain: [+.google.com, +.facebook.com, +.twitter.com, +.youtube.com, +.googleapis.com]

  fake-ip-filter: ["*.lan", "stun.*", "time.*", "ntp.*", "*.ntp.org.cn", "*.openwrt.pool.ntp.org", "time1.cloud.tencent.com", "*.edu.cn", "music.163.com", "*.music.163.com", "*.126.net", "*.kuwo.cn", "y.qq.com", "*.y.qq.com", "*.music.migu.cn", "music.migu.cn", "*.msftconnecttest.com", "*.msftncsi.com", "localhost.ptlogin2.qq.com", "*.srv.nintendo.net", "*.stun.playstation.net", "xbox.*.microsoft.com", "*.xboxlive.com"]

# ——————————————————————————————
# 4. 资源路径 (Resources)
# ——————————————————————————————
geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
  asn: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"

# ——————————————————————————————
# 5. 代理提供者 (Proxy Providers)
# ——————————————————————————————
# 公用锚点配置
p: &p
  health-check:
    enable: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 5000
    lazy: true

proxy-providers:
  proxy1:
    type: file
    path: proxy_provider/proxy1.yaml
    <<: *p

# ——————————————————————————————
# 6. 策略组 (Proxy Groups)
# ——————————————————————————————
use_all_provider: &use_all_provider
  use: [proxy1]

# 常用正则过滤器
filter_all: &filter_all "(?i)(香港|台湾|日本|新加坡|美国|韩国|🇭🇰|🇹🇼|🇯🇵|🇸🇬|🇺🇸|🇰🇷)(?!.*(?i)(官网|官網|套餐|流量|测试|test|订阅|更新|维护|暂停|通知|超时|到期|剩余|重置|倍|free|low|公益))"

