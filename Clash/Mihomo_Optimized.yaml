# —————————
# 规则提供者 (Rule Providers) 
rule-anchor:
  Local: &Local
    {type: file, behavior: classical, format: text}
  Classical: &Classical
    {type: http, behavior: classical, format: text, interval: *Time}
  IPCIDR: &IPCIDR
    {type: http, behavior: ipcidr, format: mrs, interval: *Time}
  Domain: &Domain
    {type: http, behavior: domain, format: mrs, interval: *Time}

rule-providers:
  Fake-IP-Filter: # 新增：远程 Fake-IP 过滤规则集
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    path: ./rules/fakeip-filter.mrs
    url: "https://ghfast.top/github.com/DustinWin/ruleset_geodata/raw/refs/heads/mihomo-ruleset/fakeip-filter.mrs"
  
  WebRTC:
    <<: *Classical
    path: ./rules/WebRTC.list
    url: "https://cdn.jsdelivr.net/gh/GitMetaio/Surfing@main/box_bll/clash/rules/WebRTC.list"

  # ———— 新增功能规则 ————
  AI:
    <<: *Domain
    path: ./rules/AI.mrs
    url: "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/category-ai-chat-!cn.mrs"
  
  GFW:
    <<: *Domain
    path: ./rules/GFW.mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/gfw.mrs"

  Geolocation_NotCN:
    <<: *Domain
    path: ./rules/Geolocation_NotCN.mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/geolocation-!cn.mrs"

  # ———— 常用 MRS 规则 ————
