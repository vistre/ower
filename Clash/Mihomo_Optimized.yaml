# —————————
# 分流规则
rules:
  - DST-PORT,123,DIRECT

  # 0. 自定义规则
  - DOMAIN-KEYWORD,adobe,REJECT
  - DOMAIN-KEYWORD,pilipili,DIRECT
  - DOMAIN-KEYWORD,embyplus,Emby
  - DOMAIN-SUFFIX,cdn.bgp.yt,DIRECT
  - DOMAIN-SUFFIX,media.nijigem.by,DIRECT
  - DOMAIN-SUFFIX,steamtools.net,DIRECT
  - DOMAIN-KEYWORD,steamtools,DIRECT
  - DOMAIN-SUFFIX,challenges.clouflare.com,节点选择
  - DOMAIN,v1.uhdnow.com,DIRECT
  - DOMAIN-SUFFIX,rainbowsky.xyz,DIRECT
  - DOMAIN,steamcdn-a.akamaihd.net,DIRECT
  - DOMAIN-SUFFIX,cm.steampowered.com,DIRECT
  - DOMAIN-SUFFIX,steamserver.net,DIRECT

  # 1. 基础设施与直连 (优化：Fake-IP + OR 逻辑合并)
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - DOMAIN,ntp.aliyun.com,DIRECT
  - DOMAIN,time.apple.com,DIRECT
  - DOMAIN,time.windows.com,DIRECT

  # 🔴 CORE OPTIMIZATION: 合并常见直连规则，提高匹配效率
  - OR,((RULE-SET,Private),(RULE-SET,CN),(RULE-SET,CN_IP)),DIRECT

  # 3. 广告拦截
  - RULE-SET,NoAds,广告拦截

  # 4. AI 服务
  - RULE-SET,OpenAI,OpenAI
  - RULE-SET,AI,AI服务

  # 5. Google & Gemini
  - RULE-SET,Google,Google/Gemini
  - RULE-SET,Google_IP,Google/Gemini,no-resolve
  - RULE-SET,GoogleFCM,谷歌FCM

  # 6. 热门 APP
  - RULE-SET,TikTok,国外媒体
  - RULE-SET,Spotify,国外媒体
  - RULE-SET,Discord,国外媒体
  - RULE-SET,Microsoft,微软服务
  - RULE-SET,Apple,苹果服务
  - RULE-SET,Apple_IP,苹果服务,no-resolve

  # 7. 社交与媒体
  - RULE-SET,Telegram,电报消息
  - RULE-SET,Telegram_IP,电报消息,no-resolve
  - RULE-SET,NetEaseMusic,网易音乐
  - RULE-SET,YouTube,油管视频
  - RULE-SET,Netflix,奈飞视频
  - RULE-SET,Netflix_IP,奈飞视频,no-resolve
  - RULE-SET,Bahamut,巴哈姆特
  - RULE-SET,BiliBili,哔哩哔哩
  - RULE-SET,BiliBili_IP,哔哩哔哩,no-resolve
  
  - RULE-SET,Facebook,国外媒体
  - RULE-SET,Facebook_IP,国外媒体,no-resolve
  - RULE-SET,Twitter,国外媒体
  - RULE-SET,Twitter_IP,国外媒体,no-resolve

  # 8. 游戏平台
  - RULE-SET,Epic,游戏平台
  - RULE-SET,Origin,游戏平台
  - RULE-SET,Sony,游戏平台
  - RULE-SET,Steam,游戏平台
  - RULE-SET,Nintendo,游戏平台

  # 9. 兜底保险规则
  - RULE-SET,GFW,节点选择
  - RULE-SET,Geolocation_NotCN,节点选择

  # 10. 最终兜底
